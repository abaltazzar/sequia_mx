name: Actualizar datos CONAGUA
on:
  schedule:
    - cron: "0 14 2,17 * *"   # días 2 y 17 de cada mes, 14:00 UTC
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - name: Descargar y regenerar si hay corte nuevo
        run: |
          Rscript -e '
            source("data-raw/00_descargar.R")
            if (!hay_cambios) { message("Sin corte nuevo"); quit(status = 0) }
            source("data-raw/01_limpiar_monitor.R", local = new.env())
            load("data/catalogo_municipios.rda"); load("data/municipios_sf.rda")
            source("data-raw/04_preparar_app.R", local = new.env())
            devtools::test()
          '
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data inst/shiny/sequiaMX_local
          git diff --cached --quiet || git commit -m "Actualiza datos CONAGUA ($(date +%Y-%m-%d))"
          git push
